name: docker-build

# Build the Hermes Web frontend Docker image and publish to GHCR. The build is
# NIX-FREE: the Dockerfile fetches the renderer from the LATEST upstream
# hermes-agent (HERMES_RENDERER_REV, default main) and builds with plain pnpm —
# a normal `docker build` in CI and locally. The container only serves static
# files + proxies to a gateway.
#
# Triggers: push to main, v* tags, manual dispatch, AND a WEEKLY rebuild on
# Saturday at 05:00 Polish time (the `guard` job picks the right UTC cron, so it
# runs exactly once a week — no repeats) so the image keeps tracking new upstream
# hermes-agent even with no pushes.

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # RAZ W TYGODNIU: sobota 05:00 czasu polskiego. GitHub Actions cron chodzi tylko
    # w UTC, a Polska ma CEST/CET (zmiana czasu) → dwa wpisy pokrywają obie pory roku;
    # job `guard` puszcza DOKŁADNIE JEDEN przebieg — ten o 05:00 Europe/Warsaw.
    - cron: '0 3 * * 6'   # 03:00 UTC = 05:00 CEST (czas letni)
    - cron: '0 4 * * 6'   # 04:00 UTC = 05:00 CET  (czas zimowy)
  workflow_dispatch:

jobs:
  # Bramka dla `schedule`. Cron GitHuba chodzi w UTC, a budujemy raz w tygodniu
  # o 05:00 czasu polskiego — a do tego cron realnie się opóźnia (obserwowane 4-6 h),
  # więc warunek „godzina == 05" sam by wszystko wycinał. Bramka puszcza build, gdy
  # w ostatnich 6 dniach NIE było realnej pracy tego workflow (push też się liczy
  # → nie budujemy drugi raz tego samego).
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read          # przegląd historii przebiegów (gh run list / gh run view)
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"   # push / tag / dispatch — bez kombinowania
            exit 0
          fi

          NOW="$(TZ=Europe/Warsaw date '+%Y-%m-%d %H:%M (%a)')"
          HOUR="$(TZ=Europe/Warsaw date '+%H')"
          echo "Europe/Warsaw: $NOW"

          # Czy w ostatnich 6 dniach był przebieg, który NAPRAWDĘ budował?
          # (przebieg pominięty przez bramkę ma same joby `skipped`)
          CUTOFF=$(( $(date -u +%s) - 6*24*3600 ))
          RECENT=0
          while read -r rid ts; do
            [ "$rid" = "${{ github.run_id }}" ] && continue
            [ "$(date -u -d "$ts" +%s)" -ge "$CUTOFF" ] || continue
            jobs="$(gh run view "$rid" --repo "${{ github.repository }}" --json jobs --jq '[.jobs[] | select(.name != "guard" and .conclusion != "skipped")] | length' 2>/dev/null || echo 0)"
            if [ "${jobs:-0}" -gt 0 ]; then RECENT=1; break; fi
          done < <(gh run list --repo "${{ github.repository }}" --workflow docker-build.yml \
                     --limit 30 --json databaseId,createdAt --jq '.[]|"\(.databaseId) \(.createdAt)"')

          if [ "$HOUR" -lt 5 ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Pomijam — teraz $NOW, a budujemy dopiero od 05:00 Europe/Warsaw."
          elif [ "$RECENT" = "1" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Pomijam — w ostatnich 6 dniach już budowano (jeden przebieg na tydzień)."
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "Buduję: $NOW (jeden przebieg w tym tygodniu)."
          fi

  build:
    needs: guard
    if: needs.guard.outputs.run == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max