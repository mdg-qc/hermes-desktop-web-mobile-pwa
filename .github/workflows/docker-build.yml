name: docker-build

# Build the Hermes Web frontend Docker image and publish to GHCR. The build is
# NIX-FREE: the Dockerfile fetches the renderer from the LATEST upstream
# hermes-agent (HERMES_RENDERER_REV, default main) and builds with plain pnpm —
# a normal `docker build` in CI and locally. The container only serves static
# files + proxies to a gateway.
#
# Triggers: push to main, v* tags, manual dispatch, AND a DAILY 05:00 UTC build
# so the image keeps tracking new upstream hermes-agent even with no pushes.

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Rebuild every day at 05:00 UTC to pick up the latest upstream hermes-agent.
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max